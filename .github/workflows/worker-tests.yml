name: Rasadino Worker validation
on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker syntax
        run: node --check src/worker.mjs
      - name: Run multi-user regression tests
        run: node --test tests/*.test.mjs
