name: Temporary oil provider connectivity probe
on:
  push:
    branches: ["fix/brent-oil-verified-sources-20261118"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check actual public oil feeds
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const urls = [
           'https://fred.stlouisfed.org/graph/fredgraph.csv?id=DCOILBRENTEU&cosd_start=2026-11-01',
           'https://raw.githubusercontent.com/datasets/oil-prices/main/data/brent-daily.csv',
           'https://stooq.com/q/l/?s=cb.f&f=sd2t2ohlcv&h&e=csv',
           'https://americasoilwatch.com/api/v1/brent',
           'https://americasoilwatch.com/api/v1/brent-eia-daily'
          ];
          for(const url of urls){
           try {
            const r = await fetch(url,{signal:AbortSignal.timeout(9500),headers:{'User-Agent':'RasadinoDiagnostics/1.0','Accept':'text/csv,application/json,text/plain'}});
            const body = await r.text();
            let fields=null;
            if(r.headers.get('content-type')?.includes('json')){
             try {const p=JSON.parse(body); fields=Object.fromEntries(Object.entries(p).filter(([k,v])=>!Array.isArray(v)&& (typeof v==='number'||typeof v==='string'||typeof v==='boolean')).slice(0,28));}catch{}
            }
            console.log(JSON.stringify({url,status:r.status,type:r.headers.get('content-type'),bytes:body.length,first:body.slice(0,120),last:body.slice(-260),fields}));
           } catch(e) {console.log(JSON.stringify({url,error:String(e)}));}
          }
          JS
      - name: Smoke staged Cloudflare Brent source
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const url='https://be8f1d0d-hamid-price-report-bot.mahale-market-kordkuy.workers.dev/prices';
          try{
            const r=await fetch(url,{signal:AbortSignal.timeout(28000),headers:{'Accept':'application/json'}});
            const raw=await r.text();
            let data;try{data=JSON.parse(raw)}catch{console.log('PREVIEW_NOT_JSON',r.status,raw.slice(0,220));process.exitCode=2;}
            if(data){
              const quote=data.quotes?.oil;
              console.log('CLOUDFLARE_PREVIEW',JSON.stringify({status:r.status,price:quote?.value,source:quote?.source,marketDate:quote?.marketDate,oilType:quote?.oilType,delayed:quote?.delayed,available:typeof quote?.value==='number'&&quote.value>0,hasGrowth:data.report?.includes('📈')}));
              if(!r.ok || !(typeof quote?.value==='number'&&quote.value>0))process.exitCode=3;
            }
          }catch(e){console.log('PREVIEW_ERROR',String(e));process.exitCode=2;}
          JS
