name: Music CC0 source preflight
on:
  push:
    branches: ["feature/music-file-only-*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/music-file-preflight.mjs
